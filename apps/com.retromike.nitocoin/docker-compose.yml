name: retro-mike-nitocoin
services:
  app:
    container_name: nito
    image: theretromike/nodes:nito
    restart: always
    volumes:
    - /media/ZimaOS-HD/nito:/root/.nito
    ports:
    - 7020:7020
    - 9020:9020
    command: /usr/bin/nitod -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://127.0.0.1:7020
      -rpcbind=0.0.0.0 -rpcport=9020 -rpcallowip=0.0.0.0/0 -rpcuser=pooluser -rpcpassword=poolpassword
x-casaos:
  id: com.retromike.nitocoin
  main: app
  icon: https://theretromike.github.io/retro-mike-zima-app-store/apps/com.retromike.nitocoin/assets/icon.webp
  title:
    en_US: Nitcoin (NITO) Cryptocurrency Node
  port_map: '8888'
