name: neurai
services:
  app:
    container_name: xna
    image: theretromike/nodes:neurai
    restart: always
    volumes:
    - /media/ZimaOS-HD/NodeData/xna:/root/.neurai
    ports:
    - 7011:7011
    - 9011:9011
    command:
    - /usr/bin/neuraid
    - -printtoconsole
    - -server
    - -prune=550
    - -wallet=default
    - -zmqpubhashblock=tcp://0.0.0.0:7011
    - -rpcbind=0.0.0.0
    - -rpcport=9011
    - -rpcallowip=0.0.0.0/0
    - -rpcuser=pooluser
    - -rpcpassword=poolpassword
x-casaos:
  id: com.retromike.neurai
  main: app
  icon: https://theretromike.github.io/retro-mike-zima-app-store/apps/com.retromike.neurai/assets/icon.png
  title:
    en_US: NeurAI (XNA) Node
  port_map: '8888'
