name: homepage
services:
  app:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest@sha256:fb63953c8fbc4b12ba6c51363d3a804611d17092cdd8cd363035fadded48db41
    restart: unless-stopped
    volumes:
    - /media/DATA/AppData/homepage:/app/config
    - /var/run/docker.sock:/var/run/docker.sock
    environment:
    - HOMEPAGE_ALLOWED_HOSTS=xxx:3000
x-casaos:
  id: com.retromike.homepage
  main: app
  icon: https://theretromike.github.io/retro-mike-zima-app-store/apps/com.retromike.homepage/assets/icon.png
  title:
    en_US: Homepage
  port_map: '3000'
  scheme: http
