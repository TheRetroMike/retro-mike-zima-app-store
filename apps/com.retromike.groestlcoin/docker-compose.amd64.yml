name: retro-mike-groestlcoin
services:
  app:
    container_name: grs
    image: theretromike/nodes:groestlcoin@sha256:4cd20ab94339120fbb95d69c5cb5e497f25fa13c6f6674b94f64c045f1fb0ab8
    restart: always
    volumes:
    - /media/ZimaOS-HD/grs:/root/.groestlcoin
    ports:
    - 7013:7013
    - 9013:9013
    command:
    - /usr/bin/groestlcoind
    - -printtoconsole
    - -server
    - -prune=550
    - -wallet=default
    - -zmqpubhashblock=tcp://127.0.0.1:7013
    - -rpcbind=0.0.0.0
    - -rpcport=9013
    - -rpcallowip=0.0.0.0/0
    - -rpcuser=pooluser
    - -rpcpassword=poolpassword
x-casaos:
  id: com.retromike.groestlcoin
  main: app
  icon: https://theretromike.github.io/retro-mike-zima-app-store/apps/com.retromike.groestlcoin/assets/icon.png
  title:
    en_US: Groestlcoin (GRS) Node
  port_map: '8888'
