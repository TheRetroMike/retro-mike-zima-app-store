name: retro-mike-miningcore-webui
services:
  app:
    container_name: miningcorewebui
    image: theretromike/miningcorewebui:latest@sha256:27d4de9ee72309b0fc74b99bf222d88bcf7af0703b9fe93bda3965ec6d732da0
    restart: always
    volumes:
    - /media/ZimaOS-HD/miningcore:/app/miningcore
    ports:
    - 81:8080
    environment:
    - API_BASE_URL=http://192.168.1.100:4000/api
    - MININGCORE_HOST=192.168.1.101
    - PLATFORM=ZIMAOS
    - POOL_NAME=Self-Hosted Mining Pool
    - POSTGRES_DATABASE=zimaos
    - POSTGRES_HOST=192.168.1.100
    - POSTGRES_PASSWORD=P@ssw0rd
    - POSTGRES_USER=admin
    - PUID=1000
    - STRATUM_HOST=192.168.1.100
x-casaos:
  id: com.retromike.miningcore-webui
  main: app
  icon: https://theretromike.github.io/retro-mike-zima-app-store/apps/com.retromike.miningcore-webui/assets/icon.png
  title:
    en_US: Miningcore Web UI
  port_map: '81'
