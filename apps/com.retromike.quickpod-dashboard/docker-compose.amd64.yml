name: retro-mike-quickpod-dashboard
services:
  app:
    container_name: quickpod_dashboard
    image: theretromike/quickpoddashboard:latest@sha256:bb9f82ffd4efc0a2cbd59f3c53bc729395ea1dbf4671356362c1be09ce631b54
    restart: always
    volumes:
    - /media/ZimaOS-HD/quickpoddashboard:/app/data
    ports:
