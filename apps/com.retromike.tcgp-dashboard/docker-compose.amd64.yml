name: retro-mike-tcgp-dashboard
services:
  app:
    container_name: tcgp_dashboard
    image: theretromike/tcgplayerordermanagement:latest@sha256:ba742a1a9aef2a6222bb01cf47050449fe80dc981a5658663383c08e2b9304d8
    restart: always
    volumes:
    - /media/ZimaOS-HD/tcgpdashboard:/app/data
    ports:
    - 88:7000
    environment:
    - AUTH_COOKIE=xxx
    - SELLER_ID=xxx
x-casaos:
  id: com.retromike.tcgp-dashboard
  main: app
  icon: https://theretromike.github.io/retro-mike-zima-app-store/apps/com.retromike.tcgp-dashboard/assets/icon.svg
  title:
    en_US: TCG Player Dashboard
  port_map: '88'
