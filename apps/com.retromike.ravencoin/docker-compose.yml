name: retro-mike-ravencoin
services:
  app:
    container_name: rvn
    image: theretromike/nodes:ravencoin
    restart: always
    volumes:
    - /media/ZimaOS-HD/rvn:/root/.raven
    ports:
    - 7010:7010
    - 9010:9010
    command: /usr/bin/ravend -printtoconsole -server -prune=550 -wallet=default -zmqpubhashblock=tcp://127.0.0.1:7010
      -rpcbind=0.0.0.0 -rpcport=9010 -rpcallowip=0.0.0.0/0 -rpcuser=pooluser -rpcpassword=poolpassword
x-casaos:
  id: com.retromike.ravencoin
  main: app
  icon: https://theretromike.github.io/retro-mike-zima-app-store/apps/com.retromike.ravencoin/assets/icon.png
  title:
    en_US: Ravencoin (RVN) Node
  port_map: '8888'
