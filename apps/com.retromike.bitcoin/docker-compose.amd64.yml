name: retro-mike-bitcoin
services:
  app:
    container_name: btc
    image: theretromike/nodes:bitcoin@sha256:fcf55dab81cbbea2e6295f1473aa89de70601c04699220d9ddeb03908bfd11c3
    restart: always
    volumes:
    - /media/ZimaOS-HD/NodeData/btc:/root/.bitcoin
    ports:
    - 7004:7004
    - 9004:9004
    - 8333:8333
    command:
    - /usr/bin/bitcoind
    - -printtoconsole
    - -server
    - -prune=550
    - -wallet=default
    - -zmqpubhashblock=tcp://127.0.0.1:7004
    - -rpcbind=0.0.0.0
    - -rpcport=9004
    - -rpcallowip=0.0.0.0/0
    - -port=8333
    - -rpcuser=pooluser
    - -rpcpassword=poolpassword
x-casaos:
  id: com.retromike.bitcoin
  main: app
  icon: https://theretromike.github.io/retro-mike-zima-app-store/apps/com.retromike.bitcoin/assets/icon.webp
  title:
    en_US: Bitcoin (BTC) Node
  port_map: '8888'
