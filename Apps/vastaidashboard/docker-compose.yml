name: retro-mike-vastai-dashboard
services:
  app:
    container_name: vastai_dashboard
    image: theretromike/vastaidashboard:latest
    restart: always
    volumes:
      - /media/ZimaOS-HD/vastaidashboard:/app/data
    ports:
      - "90:7000"
    environment:
      - API_KEY=xxx
x-casaos:
  id: com.retromike.vastai-dashboard
  architectures:
    - amd64
  main: app
  description:
    en_us: Vast AI Dashboard
  tagline:
    en_us: Vast AI Dashboard
  developer: Retro Mike
  author: Retro Mike
  icon: https://avatars.githubusercontent.com/u/47128086?s=200&v=4
  thumbnail: ""
  store_app_id: retro-mike-vastai-dashboard
  title:
    en_us: Vast AI Dashboard
  category: RetroMike
  port_map: "90"
