name: retro-mike-quickpod-dashboard
services:
  app:
    container_name: quickpod_dashboard
    image: theretromike/quickpoddashboard:latest
    restart: always
    volumes:
      - /media/ZimaOS-HD/quickpoddashboard:/app/data
    ports:
      - "89:7000"
    environment:
      - API_KEY=xxx
x-casaos:
  id: com.retromike.quickpod-dashboard
  architectures:
    - amd64
  main: app
  description:
    en_us: QuickPod Dashboard
  tagline:
    en_us: QuickPod Dashboard
  developer: Retro Mike
  author: Retro Mike
  icon: https://console.quickpod.io/quickpod.svg
  thumbnail: ""
  store_app_id: retro-mike-quickpod-dashboard
  title:
    en_us: QuickPod Dashboard
  category: RetroMike
  port_map: "89"
